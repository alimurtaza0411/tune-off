# Fixed training recipe shared by every run (README §"Training recipe").
optimizer:
  betas: [0.9, 0.95]
  eps: 1.0e-8
schedule:
  final_lr_ratio: 0.1       # cosine decays to 10% of the peak learning rate
precision: fp16             # fp16 autocast on CUDA; CPU always runs fp32

# Runtime-only settings: excluded from config_hash. Env vars override them.
runtime:
  results_root: ./runs      # MVT_RESULTS_ROOT
  data_cache_dir: ./.cache/mvt   # MVT_DATA_CACHE
  num_workers: 0
  device: auto              # MVT_DEVICE: auto | cuda | cpu
