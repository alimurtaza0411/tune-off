# Synthetic, deterministic tasks for tests and `mvt smoke` (no downloads).
debug_cls:
  name: debug_cls
  head: seq_cls
  num_labels: 2
  subset_seed: 1
  max_len: 16
  metric: accuracy
  floor: 0.5
  epsilon: 0.01
  batch_sizes: [8, 16, 32, 64]
  epochs: {25: 6, 100: 3}
  options: {n_train: 512, n_val: 128, n_test: 128, min_len: 8, data_seed: 0}
debug_tag:
  name: debug_tag
  head: tok_cls
  num_labels: 3
  subset_seed: 2
  max_len: 16
  metric: token_accuracy
  floor: 0.3333333333333333
  epsilon: 0.01
  batch_sizes: [8, 16, 32, 64]
  epochs: {25: 6, 100: 3}
  options: {n_train: 512, n_val: 128, n_test: 128, min_len: 8, data_seed: 1}
debug_lm:
  name: debug_lm
  head: lm
  num_labels: null
  subset_seed: 3
  max_len: 16
  metric: neg_log_ppl
  floor: null
  epsilon: 0.04879
  batch_sizes: [8, 16, 32, 64]
  epochs: {25: 6, 100: 3}
  options: {n_train: 512, n_val: 128, n_test: 128, motif_len: 4, motif_repeats: 4, data_seed: 2}
