[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mvt"
version = "0.1.0"
description = "Is Mamba harder to tune? Mamba vs. Transformers under equal, paired tuning budgets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "torch>=2.1",
  "numpy",
  "scipy",
  "pandas",
  "pyyaml",
  "pydantic>=2",
  "optuna>=3.4",
]

[project.optional-dependencies]
cuda = ["mamba-ssm", "causal-conv1d"]  # exact pins live in requirements/colab.txt
tasks = ["datasets", "seqeval"]
analysis = ["matplotlib", "scikit-learn"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "gpu: needs a CUDA GPU with mamba_ssm installed (run on Colab)",
  "data: downloads a real dataset (run by task owners)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]
