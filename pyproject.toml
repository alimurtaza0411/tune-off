[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mvt"
version = "0.1.0"
description = "Is Mamba harder to tune? Mamba vs. Transformers under equal, paired tuning budgets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "torch>=2.3",
  "numpy",
  "scipy>=1.11,<1.18",   # sobol --check relies on Sobol(seed=...)
  "pandas",
  "pyyaml",
  "pydantic>=2",
  "optuna==5.1.0",       # exact: TPE suggestions differ between versions
]

[project.optional-dependencies]
tasks = ["datasets", "seqeval"]
analysis = ["matplotlib", "scikit-learn"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not gpu and not data'"   # run GPU / data tests with -m gpu / -m data
markers = [
  "gpu: needs a CUDA GPU with mamba_ssm installed (run on Colab)",
  "data: downloads a real dataset (run by task owners)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]
